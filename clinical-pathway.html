    <div id="app"></div>

    <script>
        // =====================================================================
        //  CLINICAL PATHWAY — digital & cetak (kop kosong, isi manual)
        //  Draf standar untuk tenaga kesehatan. Silakan direvisi.
        // =====================================================================
        const state = { id: 'kpd' };
        const $ = (x) => document.getElementById(x);
        const DAYCOLS = 7;

        // token resolver: 'first'|'last'|'all'|'firstN'|array|undefined → [days]
        function resolve(tok, lama) {
            if (!tok) return [];
            if (Array.isArray(tok)) return tok;
            if (tok === 'first') return [1];
            if (tok === 'last') return [lama];
            if (tok === 'all') return Array.from({ length: lama }, (_, i) => i + 1);
            const m = /^first(\d+)$/.exec(tok); if (m) { const n = Math.min(+m[1], lama); return Array.from({ length: n }, (_, i) => i + 1); }
            return [];
        }

        // ---------- blok seksi umum (pakai token) ----------
        const S_ASESMEN_AWAL = { n: '1. ASESMEN AWAL', rows: [
            { k: 'Asesmen Awal Medis', u: 'Dokter IGD / jaga', d: 'first', t: 'Pasien masuk via IGD / VK' },
            { u: 'Dokter Spesialis (DPJP)', d: 'first' },
            { k: 'Asesmen Awal Keperawatan / Bidan', u: 'Kondisi umum, kesadaran, TTV, riwayat alergi, skrining gizi, status fungsional (Barthel), risiko jatuh & dekubitus, kebutuhan edukasi & budaya', d: 'first', t: 'Dilanjutkan asesmen bio-psiko-sosio-spiritual' }
        ] };
        const S_ASESMEN_LANJUT = { n: '5. ASESMEN LANJUTAN', rows: [
            { k: 'Asesmen Medis', u: 'Pemeriksaan DPJP', d: 'all', t: 'Visite harian / follow up' },
            { u: 'Dokter non-DPJP / dr. ruangan', d: 'all', t: 'Atas indikasi / emergency' },
            { k: 'Asesmen Keperawatan', u: 'Perawat / bidan penanggung jawab', d: 'all', t: 'Dilakukan dalam 3 shift' },
            { k: 'Asesmen Gizi', u: 'Tenaga gizi (skrining malnutrisi, antropometri, biokimia, fisik/klinis, riwayat makan)', d: 'all', t: 'Asesmen dalam 48 jam' },
            { k: 'Asesmen Farmasi', u: 'Telaah resep & rekonsiliasi obat', d: 'all' }
        ] };
        const S_DISCHARGE = { n: '7. DISCHARGE PLANNING', rows: [
            { u: 'Informasi aktivitas sesuai kondisi pasien', d: 'first', t: 'Program Pendidikan Pasien & Keluarga' },
            { u: 'Terapi: kegunaan obat, dosis, efek samping', d: 'first' },
            { u: 'Penjelasan gejala kekambuhan & penanganannya', d: 'first' },
            { u: 'Diet pemulihan sesuai kondisi', d: 'first' }
        ] };
        const S_EDUKASI = { n: '8. EDUKASI TERINTEGRASI', rows: [
            { k: 'Edukasi Medis', u: 'Penjelasan diagnosis, rencana terapi, informed consent', d: 'first', t: 'Oleh semua PPA; berdasarkan discharge planning' },
            { k: 'Edukasi Gizi', u: 'Konseling diet sesuai kondisi (bertahap, TETP bila perlu)', d: 'first2' },

            { k: 'Formulir', u: 'Lembar Edukasi Terintegrasi', d: 'first', t: 'Di-TTD keluarga / pasien' }
        ] };
        const S_TATA_KEP = [
            { k: 'Tatalaksana Keperawatan / Bidan', u: 'NIC 1400 Manajemen nyeri', d: 'all', t: 'Mengacu NIC' },
            { u: 'NIC 6040 Terapi relaksasi', d: 'all' },
            { u: 'NIC 5820 Reduksi ansietas', d: 'all' },
            { u: 'NIC 6540 Kontrol infeksi', d: 'all' },
            { u: 'NIC 4190 Pemasangan infus', d: 'first' },
            { u: 'NIC 2314 Kolaborasi pemberian obat', d: 'all' }
        ];
        const S_TATA_GIZIFAR = [
            { k: 'Tatalaksana Gizi', u: 'Diet bertahap sesuai kondisi (cair/saring/lunak/biasa); TETP bila perlu', d: 'all', t: 'Disesuaikan usia & kondisi klinis' },
            { k: 'Tatalaksana Farmasi', u: 'Rekomendasi ke DPJP & intervensi farmasi', d: 'all', t: 'Sesuai hasil monitoring' }

        const S_MONITORING = { n: '11. MONITORING & EVALUASI', rows: [
            { k: 'Dokter DPJP', u: 'Asesmen ulang & review verifikasi rencana asuhan', d: 'all' },
            { k: 'Keperawatan / Bidan', u: 'Monitoring skala nyeri, tanda kecemasan, tanda infeksi, kondisi luka, TTV', d: 'all', t: 'Mengacu NOC · 3 shift' },

        const S_MOBILISASI = { n: '12. MOBILISASI / REHABILITASI', rows: [
            { k: 'Keperawatan', u: 'Mobilisasi dibantu sebagian → mandiri bertahap', d: 'all' }
        ] };
        const S_OUT_KEPGIZIFAR = [
            { k: 'Keperawatan', u: 'NOC 1605 Kontrol nyeri; NOC 1211 Level ansietas; NOC 1102 Penyembuhan luka; NOC 0703 Keparahan infeksi', d: 'all', t: 'Mengacu NOC · 3 shift' },

        const S_RENCANA = { n: '15. RENCANA PULANG / EDUKASI LANJUTAN', rows: [
            { u: 'Resume medis & keperawatan', d: 'last', t: 'Pasien membawa resume / surat rujukan / surat kontrol saat pulang' },
            { u: 'Penjelasan sesuai keadaan umum pasien', d: 'last' },

        // ---------- definisi pathway (konten spesifik) ----------
        const PATHWAYS = {
            kpd: {
                nama: 'Ketuban Pecah Dini (KPD)', icd: 'O42', lama: 3,
                lab: ['Darah lengkap', 'Masa perdarahan & pembekuan', 'Gula darah sewaktu', 'Elektrolit', 'Fungsi ginjal (ureum, kreatinin)', 'Tes lakmus / nitrazin (± kultur)'],

                konsultasi: ['Dokter Obsgin (DPJP)', 'Dokter Anestesi', 'Dokter Anak'],
                dxMedis: 'Ketuban Pecah Dini', dxKep: ['00132 Nyeri akut', '00004 Risiko infeksi', '00146 Ansietas'],
                dxGizi: 'Prediksi suboptimal asupan energi terkait rencana tindakan (N1-1.4)',
                terapi: [
                    { k: 'Injeksi', u: 'Antibiotik spektrum luas (mis. Ceftriaxone 1 g IV / 12 jam)', d: 'all' },
                    { u: 'Analgetik simptomatik', v: 'all' },
                    { k: 'Induksi', u: 'Drip oksitosin 5 IU + RL 500 cc', d: 'first', t: 'Bila Bishop > 5' },
                    { u: 'Misoprostol (pematangan serviks)', v: 'first', t: 'Bila Bishop < 5' },
                    { k: 'Cairan Infus', u: 'RL / NaCl / Dextrose 5%', d: 'all' },
                    { k: 'Obat Pulang', u: 'Cefadroksil 500 mg, Asam mefenamat 500 mg, Roboransia', d: 'last' }
                ],
                tataMedis: 'Infus jaga + antibiotik spektrum luas; terminasi sesuai usia kehamilan & tanda infeksi; utamakan persalinan pervaginam, SC hanya atas indikasi obstetri',
                outMedis: 'Persalinan terlaksana, tidak ada tanda infeksi/korioamnionitis, ibu & bayi stabil',
                sumber: 'PPK Obgyn RSHS 2015 — Infeksi Intrauterin dlm Kehamilan & Persalinan (hal. 51; KPD sbg faktor predisposisi, prinsip terminasi + antibiotik spektrum luas). Struktur grid & kode keperawatan = template standar.'
            },
            ppi: {
                nama: 'Partus Prematurus Iminens (PPI)', icd: 'O60.0', lama: 3,
                lab: ['Darah lengkap', 'Urinalisis / kultur urin', 'Gula darah sewaktu', 'Swab vagina (bila indikasi)'],
                radiologi: [{ u: 'USG: TBJ, panjang serviks, presentasi, cairan amnion', d: 'first' }],
                konsultasi: ['Dokter Obsgin (DPJP)', 'Dokter Anak / Neonatologi'],
                dxMedis: 'Partus prematurus iminens (ancaman persalinan preterm 20–36⁺⁶ mgg)',
                dxKep: ['00256 Nyeri persalinan', '00146 Ansietas', '00004 Risiko infeksi'], dxGizi: 'Asupan adekuat',
                terapi: [
                    { k: 'Tokolitik', u: 'Nifedipin 10 mg oral, ulang tiap 20 mnt (maks 40 mg/jam) lalu rumatan', d: 'first', t: 'Tunda persalinan 48 jam' },
                    { k: 'Pematangan paru', u: 'Deksametason 6 mg IM / 12 jam × 4 (atau Betametason 12 mg / 24 jam × 2)', d: 'first', t: 'Usia 24–34 mgg' },

                tataMedis: 'Tirah baring + hidrasi; tokolisis untuk tunda persalinan 48 jam agar kortikosteroid bekerja; cari & atasi pemicu (ISK/infeksi); rujuk bila < 34 mgg / perlu NICU',
                outMedis: 'Kontraksi teratasi & kehamilan dipertahankan, atau persalinan preterm terkelola dengan bayi stabil',
                sumber: 'Standar persalinan preterm (POGI; tokolitik nifedipin, kortikosteroid 24–34 mgg, MgSO₄ neuroproteksi < 32 mgg). PPK RSHS extract tidak memuat PPI khusus; struktur = template standar.'
            },
            heg: {
                nama: 'Hiperemesis Gravidarum (HEG)', icd: 'O21.1', lama: 3,
                lab: ['Keton urin', 'Elektrolit', 'Darah lengkap', 'Fungsi hati & ginjal (bila berat)'],
                radiologi: [{ u: 'USG: letak kantung, jumlah janin, usia kehamilan, singkirkan mola', d: 'first' }],

                dxKep: ['00002 Ketidakseimbangan nutrisi kurang', '00027 Kekurangan volume cairan', '00146 Ansietas'],
                dxGizi: 'Asupan tidak adekuat akibat mual-muntah',
                terapi: [
                    { k: 'Antiemetik', u: 'Piridoksin ± doksilamin (lini 1); metoklopramid / ondansetron', d: 'all' },

                    { u: 'Dekstrose 5–10% setelah dehidrasi teratasi', d: 'all' },
                    { k: 'Suplemen', u: 'Tiamin (vit B1) pada muntah berkepanjangan', v: 'all' }
                ],
                tataMedis: 'Koreksi dehidrasi, ketonemia & elektrolit dengan cairan IV; antiemetik bertahap; puasa lalu diet bertahap; rawat bila terapi oral gagal; pulang bila toleransi makan-minum baik',
                outMedis: 'Mual-muntah terkontrol, hidrasi baik, keton (-), toleransi diet oral',
                sumber: 'PPK Obgyn RSHS 2015 — Hiperemesis Gravidarum (hal. 3; antiemetik oral lini 1, rehidrasi NaCl/RL, Dekstrose 5–10%). Struktur grid & kode keperawatan = template standar.'
            },
            peb: {
                nama: 'Preeklampsia Berat (PEB)', icd: 'O14.1', lama: 4,
                lab: ['Darah lengkap + trombosit', 'Fungsi hati (SGOT/SGPT, LDH)', 'Fungsi ginjal (ureum, kreatinin, asam urat)', 'Protein urin (dipstik / 24 jam)', 'Elektrolit'],
                radiologi: [{ u: 'EKG', t: 'Atas indikasi' }, { u: 'Thorax AP', t: 'Bila curiga edema paru' }],
                konsultasi: ['Dokter Obsgin (DPJP)', 'Dokter Anestesi', 'Dokter Anak', 'Penyakit Dalam / Jantung (bila perlu)'],
                dxMedis: 'Preeklampsia Berat (TD ≥160/110 + gejala/tanda berat atau disfungsi organ)',

                terapi: [
                    { k: 'Antikejang', u: 'MgSO₄ loading 4 g IV + rumatan sesuai protokol', d: 'all' },
                    { u: 'Kalsium glukonas 1 g IV (antidotum) — sedia', v: 'all' },
                    { k: 'Antihipertensi', u: 'Nifedipin oral short-acting 10 mg, ulang tiap 15–30 mnt (maks 30 mg); target <160/110', d: 'all' },

                    { k: 'Cairan Infus', u: 'RL terkontrol (pantau balans)', d: 'all' }
                ],
                tataMedis: 'Nilai keparahan & usia kehamilan → ekspektatif vs terminasi; kontrol TD & pencegahan kejang (MgSO₄); rujuk fasilitas perawatan intensif maternal-neonatal; kortikosteroid pematangan paru bila < 34 mgg',

                sumber: 'PPK Obgyn RSHS 2015 + PNPK Preeklampsia POGI 2016 — Preeklampsia (MgSO₄ antikejang lini pertama; Nifedipin target <160/110; Ca glukonas antidotum). Struktur grid & kode keperawatan = template standar.'

            scmow: {
                nama: 'Seksio Sesarea + MOW (tubektomi)', icd: 'O82 + Z30.2', lama: 3,

                dxMedis: 'Kehamilan dengan indikasi SC + permintaan kontrasepsi mantap wanita (MOW/tubektomi)',
                dxKep: ['00132 Nyeri akut', '00004 Risiko infeksi', '00085 Hambatan mobilitas fisik'],
                dxGizi: 'Prediksi suboptimal asupan energi terkait tindakan bedah (N1-1.4)',
                terapi: [
                    { k: 'Injeksi', u: 'Ceftriaxone 1 g IV / 12 jam', d: 'all' },
                    { u: 'Analgetik (ketorolac / parasetamol IV)', d: 'all' },
                    { u: 'Oksitosin drip pasca-plasenta', d: 'first' },
                    { k: 'Cairan Infus', u: 'RL / NaCl', d: 'all' },
                    { k: 'Obat Pulang', u: 'Cefadroksil 500 mg, Asam mefenamat 500 mg, SF, Roboransia', d: 'last' }
                ],
                tataMedis: 'Konseling & informed consent kontrasepsi mantap (MOW) — sukarela, sebelum operasi; persiapan pra-op (puasa, infus, kateter, sediakan darah); seksio sesarea; tubektomi (mis. Pomeroy) intra-operatif; perawatan luka',

            },
            gh: {
                nama: 'Hipertensi Gestasional (GH)', icd: 'O13', lama: 3,
                lab: ['Protein urin (menyingkirkan preeklampsia)', 'Darah lengkap + trombosit', 'Fungsi hati & ginjal', 'Asam urat'],
                radiologi: [{ u: 'USG: kesejahteraan & pertumbuhan janin', d: 'first' }],
                konsultasi: ['Dokter Obsgin (DPJP)', 'Dokter Anak (bila terminasi)'],
                dxMedis: 'Hipertensi gestasional (TD ≥140/90 ≥20 mgg TANPA proteinuria / disfungsi organ)',
                dxKep: ['00146 Ansietas', '00035 Risiko cedera', '00206 Risiko perdarahan'], dxGizi: 'Diet seimbang',

                tataMedis: 'Pantau TD, proteinuria, gejala & kesejahteraan janin; antihipertensi bila perlu; waspada perburukan menjadi preeklampsia; rencana persalinan ±37–40 mgg',

                sumber: 'PNPK Preeklampsia POGI 2016 / PPK RSHS Preeklampsia (acuan ambang TD & antihipertensi). Hipertensi gestasional = hipertensi ≥20 mgg tanpa proteinuria. Struktur = template standar.'

            kista: {
                nama: 'Kista Ovarium', icd: 'N83.2', lama: 3,
                lab: ['Darah lengkap', 'CA-125 (bila curiga ganas)', 'Golongan darah', 'Tes kehamilan (singkirkan)'],
                radiologi: [{ u: 'USG transvaginal: karakter kista (nilai risiko IOTA)', d: 'first' }, { u: 'CT/MRI', t: 'Bila perlu' }],
                konsultasi: ['Dokter Obsgin (DPJP)', 'Dokter Anestesi (bila operasi)'],
                dxMedis: 'Kista ovarium — evaluasi risiko keganasan (IOTA Simple Rules / RMI)',

                ],
                tataMedis: 'Observasi bila kista fungsional < 5 cm asimtomatik; operatif (kistektomi / salpingo-ooforektomi; laparoskopi atau laparotomi) bila simtomatik / persisten / curiga ganas / torsio; kirim PA',

        // ---------- rakit 15 seksi untuk sebuah pathway ----------
        function buildSections(pw) {
            const radioRows = (pw.radiologi && pw.radiologi.length) ? pw.radiologi.map(r => ({ u: r.u, d: 'first', t: r.t })) : [{ u: '(sesuai indikasi)', d: [] }];
            return [
                S_ASESMEN_AWAL,
                { n: '2. LABORATORIUM', rows: pw.lab.map(l => ({ u: l, d: 'first' })) },
                { n: '3. RADIOLOGI / IMAGING', rows: radioRows },
                { n: '4. KONSULTASI', rows: pw.konsultasi.map(k => ({ u: k, d: 'first' })) },
                S_ASESMEN_LANJUT,
                { n: '6. DIAGNOSIS', rows: [
                    { k: 'Diagnosis Medis', u: pw.dxMedis, d: 'all' },
                    { k: 'Diagnosis Keperawatan', u: pw.dxKep.join('; '), d: 'all', t: 'Masalah keperawatan harian' },
                    { k: 'Diagnosis Gizi', u: pw.dxGizi, d: 'first' }
                ] },
                S_DISCHARGE,
                S_EDUKASI,
                { n: '9. TERAPI / MEDIKAMENTOSA', rows: pw.terapi },
                { n: '10. TATALAKSANA / INTERVENSI', rows: [
                    { k: 'Tatalaksana Medis', u: pw.tataMedis, d: 'first' },
                    ...S_TATA_KEP, ...S_TATA_GIZIFAR
                ] },
                S_MONITORING,
                S_MOBILISASI,
                { n: '13. OUTCOME / HASIL', rows: [
                    { k: 'Medis', u: pw.outMedis, d: 'last' },
                    ...S_OUT_KEPGIZIFAR
                ] },
                { n: '14. KRITERIA PULANG', rows: [
                    { u: 'Umum: hemodinamik stabil, intake baik, mobilisasi baik', d: 'last', t: 'Sesuai PPK' },
                    { u: 'Khusus: tanda bahaya (-), tidak ada komplikasi, bayi sehat (bila bersalin)', d: 'last' }
                ] },
                S_RENCANA
            ];
        }

        // ---------- render tabel ----------
        function dayCells(row, lama) {
            const plan = resolve(row.d, lama), vr = resolve(row.v, lama);
            let out = '';
            for (let i = 1; i <= DAYCOLS; i++) {
                const cls = plan.includes(i) ? 'plan' : (vr.includes(i) ? 'var' : '');
                out += `<td class="cp-day ${cls}" onclick="this.classList.toggle('done')"></td>`;
            }
            return out;
        }
        function renderTable() {
            const pw = PATHWAYS[state.id];
            const secs = buildSections(pw);
            let rows = '';
            secs.forEach(s => {
                rows += `<tr><td class="cp-sec" colspan="${3 + DAYCOLS}">${s.n}</td></tr>`;
                s.rows.forEach(r => {
                    rows += `<tr>
                        <td class="cp-keg">${r.k || ''}</td>
                        <td>${r.u || ''}</td>
                        ${dayCells(r, pw.lama)}
                        <td style="width:18%">${r.t || ''}</td>
                    </tr>`;
                });
            });
            let dayHead = '';
            for (let i = 1; i <= DAYCOLS; i++) dayHead += `<th class="cp-day">${i}</th>`;
            return `<div class="cp-wrap overflow-x-auto">
                <table class="cp-table">
                    <thead>
                        <tr><th class="cp-keg" rowspan="2">KEGIATAN</th><th rowspan="2">URAIAN KEGIATAN</th><th colspan="${DAYCOLS}">HARI KE</th><th rowspan="2">KETERANGAN</th></tr>
                        <tr>${dayHead}</tr>
                    </thead>
                    <tbody>${rows}</tbody>
                </table>
            </div>`;
        }

    <script>
    (function(){
        var KEY='ramli_font_scale', STEPS=[90,100,112,125,140,160];
        function idx(){var v;try{v=parseInt(localStorage.getItem(KEY),10);}catch(e){}var i=STEPS.indexOf(v);return i<0?1:i;}
        function apply(i){var p=STEPS[i];document.documentElement.style.fontSize=p+'%';var l=document.getElementById('fontLbl');if(l)l.textContent=p+'%';}
        window.setFont=function(d){var i=Math.max(0,Math.min(STEPS.length-1,idx()+d));try{localStorage.setItem(KEY,STEPS[i]);}catch(e){}apply(i);};
        apply(idx());
    })();
    </script>
